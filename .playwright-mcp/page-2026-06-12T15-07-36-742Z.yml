                            - text: "A: 通常呢 供应商会有一个"
                            - code [ref=e601]: /v1/models
                            - text: 的端点，只要 GET请求 附带你的token到请求头中，打过去就能得到 一个 json结果 里面就是 提供的模型ID
                          - paragraph [ref=e602]:
                            - text: "Q: 响应码 4xx （no body）?"
