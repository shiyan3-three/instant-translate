                            - text: (家目录指代) 的 请看
                            - 'link "Claude Code 使用原生 `--settings` 选项配置多个自定义模型供应商 链接已点击 371 次" [ref=e596] [cursor=pointer]':
                              - /url: https://linux.do/t/topic/957691
                              - text: "Claude Code 使用原生 `--settings` 选项配置多个自定义模型供应商 371"
                            - text: 加以理解
                          - paragraph [ref=e597]:
                            - text: Q：此处的BASE_URL 应该怎么填 格式怎样
                            - text: A：CC默认会追加
                            - code [ref=e598]: /v1/messages
                            - text: 拼接 进行 LLM请求，所以 BASE_URL 就是指 抠掉这块之前的那部分 动动你的小脑瓜 不要想当然无脑 往上自己追加 /v1 后缀
