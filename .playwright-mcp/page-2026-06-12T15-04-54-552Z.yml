                        - generic [ref=e1045]: 4月 14 日 -
                        - generic [ref=e1046]: 如果是通过axonhub接入anyrouter的佬友应该有遇到这种情况，即便是claude code已经/model切换到opus[1m]，也始终报错400让更换1m模型，即便开启user-agent透传也没用。 根据论坛哈雷佬之前在某个帖子提到的修改请求头，找gpt研究了下，发现了问题是axonhub并没有原样cc请求里的请求头键值。 具体修改办法就是， axonhub找到anyrouter渠道，点尾部三个点里面的覆盖设置，切到覆盖请求头，新增操作，操作类型选设置，键名填Anthropic-Beta，键值填 claude-code-20250219,context-1m-2025-08...
