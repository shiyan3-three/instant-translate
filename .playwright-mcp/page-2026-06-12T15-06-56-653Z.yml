                        - generic [ref=e403]:
                          - button "帖子编辑历史记录" [ref=e405] [cursor=pointer]:
                            - img [ref=e406]
                            - generic [ref=e407]: "6"
                          - link "14 天" [ref=e409] [cursor=pointer]:
