                          - generic "帖子未读" [ref=e410]:
                            - img [ref=e411]
                      - generic [ref=e412]:
                        - generic [ref=e413]:
                          - paragraph [ref=e414]:
                            - strong [ref=e415]: 前情提要：
                            - text: 我发现很多佬友都在询问any中应该如何配置才能够正常使用claude code 以及codex，目前一些配置零零散散，没有完整的内容。同时，还有很多人有一些使用疑问，遂开集中帖，给出完整可用的配置以及常见问题答疑
                          - paragraph [ref=e416]: 以下配置在不同设备配置包括其他佬友测试均可用，可直接拷贝复用！
                          - paragraph [ref=e417]:
                            - strong [ref=e418]: claude code配置
                            - text: export ANTHROPIC_AUTH_TOKEN=“sk-xxx”
                            - text: export ANTHROPIC_BASE_URL=“
                            - link "https://a-ocnfniawgw.cn-shanghai.fcapp.run 链接已点击 157 次" [ref=e419] [cursor=pointer]:
                              - /url: https://a-ocnfniawgw.cn-shanghai.fcapp.run
                              - text: https://a-ocnfniawgw.cn-shanghai.fcapp.run 157
                            - text: ”
                            - text: export CLAUDE_CODE_ATTRIBUTION_HEADER=“0”
                            - text: export API_HOST=“a-ocnfniawgw.cn-shanghai.fcapp.run”
                            - text: export ENABLE_TOOL_SEARCH=“false”
                            - text: export CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=“1”
                            - text: export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=“1”
                          - paragraph [ref=e420]:
                            - strong [ref=e421]: codex 配置
                            - text: model_provider = “Custom”
                            - text: model = “gpt-5.5”
                            - text: review_model = “gpt-5.5”
                            - text: model_reasoning_effort = “high”
                            - text: disable_response_storage = true
                            - text: network_access = “enabled”
                            - text: windows_wsl_setup_acknowledged = true
                            - text: model_context_window = 1000000
                            - text: model_auto_compact_token_limit = 900000
                          - paragraph [ref=e422]:
                            - text: "[model_providers.Custom]"
                            - text: name = “Custom”
                            - text: base_url = “
                            - link "https://a-ocnfniawgw.cn-shanghai.fcapp.run/v1 链接已点击 110 次" [ref=e423] [cursor=pointer]:
                              - /url: https://a-ocnfniawgw.cn-shanghai.fcapp.run/v1
                              - text: https://a-ocnfniawgw.cn-shanghai.fcapp.run/v1 110
                            - text: ”
                            - text: wire_api = “responses”
                            - text: requires_openai_auth = true
                          - paragraph [ref=e424]: ————————————————————————————————————
                          - paragraph [ref=e425]: "答疑区（QA）:"
                          - blockquote [ref=e426]:
                            - paragraph [ref=e427]:
                              - text: "Q: 一直retrying是怎末回事？"
                              - text: "A: 大概率是限流，一直尝试重连，10次以后会显示服务不可用。但并不代表any无法使用，请尝试在其他时间段继续尝试发送给消息。当然如果一直retrying,那可能代表你暂时用不了了。"
                          - blockquote [ref=e428]:
                            - paragraph [ref=e429]:
                              - text: "Q: any限制cc版本吗，高版本是不是不兼容"
                              - text: "A: 参考如上配置，可兼容最新版本。经过长期实测（半年以上），any可以一直兼容最新版本，放心升级。特殊情况除外，也可能会有个别人报错"
                          - blockquote [ref=e430]:
                            - paragraph [ref=e431]:
                              - text: "Q: any显示用户已封禁怎末办?"
                              - text: "A: 凉拌，你真的被封了，也许any大善人哪天会大赦天下"
                          - blockquote [ref=e432]:
                            - paragraph [ref=e433]:
                              - text: "Q: any输出以及响应非常慢怎末办？"
                              - text: "A: 分两种状态，如果新开对话开始就非常慢，那么就是并发太高，本来就慢，作为用户量最大的公益站，该情况非常常见。第二种状态为随着对话的上下文变长原来越慢，初步推断为带宽问题，上下行流量太大，长上下文响应时间几乎线性增大，10-150s都有可能，再大一些的上下文，甚至会触发retrying，但是往往挂着重试，也会缓慢继续响应.codex同理"
                          - blockquote [ref=e434]:
                            - paragraph [ref=e435]:
                              - text: "Q: 为什莫同样的时间和配置，有的账号能够使用，有的账号不能够使用呢？"
                              - text: "A: 正常、非常正常，any采用了一种我们并不清楚的限流策略，即使整体可用，也会时常部分人可用，部分人不可用。其规律并不可测，如果运气好，部分账号甚至可以长期，不间断的大批量使用。总之，祈求any之神的临幸吧！"
                          - blockquote [ref=e436]:
                            - paragraph [ref=e437]:
                              - text: "Q: 显示模型不存在"
                              - text: "A: any在A\\更新模型后会同步更新至最新模型，一般旧模型会停用，所以一半请指定使用最新模型，当前为claude-opus-4-8[1m]"
                          - blockquote [ref=e438]:
                            - paragraph [ref=e439]:
                              - text: "Q: codex压缩失败"
