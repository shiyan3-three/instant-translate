[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-translate"
version = "0.1.0"
description = "Windows desktop overlay translator for fixed screen regions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.9,<7",
]

[project.scripts]
instant-translate = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
